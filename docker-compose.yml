services:
  postgres:
    image: postgres:18-alpine
    container_name: codelive_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codelive
      POSTGRES_PASSWORD: codelive
      POSTGRES_DB: codelive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codelive"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - codelive_network

  postgres_test:
    image: postgres:18-alpine
    container_name: codelive_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: codelive
      POSTGRES_PASSWORD: codelive
      POSTGRES_DB: codelive_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codelive -d codelive_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - codelive_network

volumes:
  postgres_data:
  postgres_test_data:

networks:
  codelive_network:
    driver: bridge
