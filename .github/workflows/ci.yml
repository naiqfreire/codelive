name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  backend:
    name: Backend (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Create .env from template
        run: |
          cp .env.example .env
          python - <<'PY'
          import secrets, pathlib
          p = pathlib.Path(".env")
          text = p.read_text().replace(
              "localhost:5432/codelive_test", "localhost:5433/codelive_test"
          )
          lines = [
              f"SESSION_SECRET={secrets.token_urlsafe(32)}"
              if line.startswith("SESSION_SECRET=")
              else line
              for line in text.splitlines()
          ]
          p.write_text("\n".join(lines) + "\n")
          PY

      - name: Start PostgreSQL (Docker Compose)
        run: docker compose up -d --wait postgres postgres_test

      - name: Run migrations (test DB)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://codelive:codelive@localhost:5433/codelive_test
        run: python -m alembic upgrade head

      - name: Run unit tests (no database)
        run: python -m pytest backend/app/features -q

      - name: Run integration tests (real PostgreSQL)
        run: python -m pytest backend/tests/integration -q

      - name: Tear down PostgreSQL
        if: always()
        run: docker compose --profile test down -v

  docker:
    name: Docker (full stack smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env from template
        run: |
          cp .env.example .env
          python3 - <<'PY'
          import secrets, pathlib
          p = pathlib.Path(".env")
          lines = [
              f"SESSION_SECRET={secrets.token_urlsafe(32)}"
              if line.startswith("SESSION_SECRET=")
              else line
              for line in p.read_text().splitlines()
          ]
          p.write_text("\n".join(lines) + "\n")
          PY

      - name: Build and start the stack
        run: docker compose up --build -d --wait

      - name: Smoke test (SPA, /api proxy, WebSocket upgrade)
        run: bash scripts/smoke-docker.sh

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
