# Single browser origin for the SPA and the API (task #49).
#
# Serving the built frontend and proxying /api from the same origin keeps the
# three things the app depends on intact:
#   * the httpOnly session cookie is first-party,
#   * the Origin header (required by OriginCheckMiddleware on writes) matches
#     ALLOWED_ORIGINS,
#   * the room WebSocket upgrades through the same host as the page.
# This mirrors what the Vite dev proxy does at http://localhost:5173.

# HTTP/1.1 upgrade tunnel for /api/ws/rooms/{id}. "close" keeps plain HTTP
# requests from being sent with a dangling Connection: upgrade header.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # index.html must never be cached: it points at hashed asset filenames.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite emits content-hashed filenames, so they are safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # REST + WebSocket API, plus /docs and /openapi.json reachable in the image.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Origin is forwarded untouched: admission rejects anything not in
        # ALLOWED_ORIGINS and the session cookie must travel with the handshake.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Room channels stay open while the owner edits; do not cut idle sockets.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /docs {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /redoc {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router uses history mode: unknown paths must return the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
